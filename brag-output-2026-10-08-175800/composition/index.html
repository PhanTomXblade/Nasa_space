<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Silent Sentinels - The Warranty Audit</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #030712;
      }
      .clip {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <!-- Modular Scene Sub-Compositions -->
      <div
        id="scene-1-host"
        class="clip"
        data-composition-id="scene1"
        data-composition-src="compositions/scene1-warranty.html"
        data-start="0"
        data-duration="3.7"
        data-track-index="1"
      ></div>

      <div
        id="scene-2-host"
        class="clip"
        data-composition-id="scene2"
        data-composition-src="compositions/scene2-mileage.html"
        data-start="3.7"
        data-duration="4.8"
        data-track-index="2"
      ></div>

      <div
        id="scene-3-host"
        class="clip"
        data-composition-id="scene3"
        data-composition-src="compositions/scene3-teardown.html"
        data-start="8.5"
        data-duration="7.0"
        data-track-index="3"
      ></div>

      <div
        id="scene-4-host"
        class="clip"
        data-composition-id="scene4"
        data-composition-src="compositions/scene4-claim.html"
        data-start="15.5"
        data-duration="4.5"
        data-track-index="4"
      ></div>

      <!-- Audio Track Layer -->
      <audio
        id="bg-music"
        data-start="0"
        data-duration="20"
        data-track-index="10"
        data-volume="0.35"
        data-fade-out="1"
        src="assets/music/happy-beats-business-moves-vol-11-by-ende-dot-app.mp3"
      ></audio>

      <audio
        id="sfx-click1"
        data-start="1.4"
        data-duration="0.08"
        data-track-index="11"
        data-volume="0.7"
        src="assets/sfx/interface/click_001.ogg"
      ></audio>

      <audio
        id="sfx-impact1"
        data-start="3.7"
        data-duration="0.18"
        data-track-index="12"
        data-volume="0.75"
        src="assets/sfx/impact/impactSoft_medium_001.ogg"
      ></audio>

      <audio
        id="sfx-drop1"
        data-start="8.9"
        data-duration="0.11"
        data-track-index="13"
        data-volume="0.7"
        src="assets/sfx/interface/drop_001.ogg"
      ></audio>

      <audio
        id="sfx-drop2"
        data-start="11.0"
        data-duration="0.11"
        data-track-index="14"
        data-volume="0.7"
        src="assets/sfx/interface/drop_001.ogg"
      ></audio>

      <audio
        id="sfx-drop3"
        data-start="13.1"
        data-duration="0.11"
        data-track-index="15"
        data-volume="0.7"
        src="assets/sfx/interface/drop_001.ogg"
      ></audio>

      <audio
        id="sfx-bell"
        data-start="17.91"
        data-duration="1.48"
        data-track-index="16"
        data-volume="0.8"
        src="assets/sfx/impact/impactBell_heavy_000.ogg"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to("#root", { duration: 20, ease: "none" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
