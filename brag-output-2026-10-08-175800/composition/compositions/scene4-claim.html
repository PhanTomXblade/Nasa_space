<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Scene 4: The Warranty Claim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700&family=Space+Grotesk:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #030712;
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 50%, #061826 0%, #030712 80%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 100px;
      }

      .starfield {
        position: absolute;
        inset: 0;
        background-image: 
          radial-gradient(1.5px 1.5px at 150px 220px, #ffffff 100%, transparent),
          radial-gradient(1px 1px at 450px 180px, #34d399 100%, transparent),
          radial-gradient(2px 2px at 850px 720px, #ffffff 100%, transparent),
          radial-gradient(1.5px 1.5px at 1250px 300px, #22d3ee 100%, transparent),
          radial-gradient(1px 1px at 1650px 200px, #ffffff 100%, transparent),
          radial-gradient(2px 2px at 1720px 850px, #34d399 100%, transparent);
        opacity: 0.85;
      }

      .aurora-glow {
        position: absolute;
        width: 1400px;
        height: 900px;
        background: radial-gradient(ellipse, rgba(52, 211, 153, 0.28) 0%, rgba(16, 185, 129, 0.12) 45%, transparent 70%);
        filter: blur(85px);
        pointer-events: none;
      }

      .hud-topbar {
        position: absolute;
        top: 60px;
        left: 80px;
        right: 80px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #34d399;
      }
      .hud-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 6px 18px;
        border-radius: 9999px;
        background: rgba(52, 211, 153, 0.12);
        border: 1px solid rgba(52, 211, 153, 0.35);
        color: #a7f3d0;
      }
      .pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 10px #34d399;
      }

      .outro-sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #34d399;
        margin-bottom: 24px;
      }

      .outro-headline {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 80px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.1;
        text-transform: uppercase;
        color: #ffffff;
        margin-bottom: 22px;
        text-shadow: 0 0 50px rgba(52, 211, 153, 0.5);
      }

      .outro-promise {
        position: relative;
        z-index: 10;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 28px;
        font-weight: 600;
        color: #cbd5e1;
        max-width: 1200px;
        line-height: 1.4;
        margin-bottom: 50px;
      }

      .cta-badge {
        position: relative;
        z-index: 5;
        display: inline-flex;
        align-items: center;
        gap: 18px;
        padding: 20px 48px;
        border-radius: 9999px;
        background: #34d399;
        color: #022c22;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        box-shadow: 0 0 55px rgba(52, 211, 153, 0.6);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="scene4"
      data-width="1920"
      data-height="1080"
    >
      <div class="starfield"></div>
      <div class="aurora-glow"></div>

      <div class="hud-topbar" id="hud-bar-4">
        <div class="hud-badge">
          <span class="pulse-dot"></span>
          <span>Final Audit Verdict</span>
        </div>
        <div>MONUMENT ARCHIVE COMPLETE</div>
        <div>PERMANENT CARTOGRAPHY ONLINE</div>
      </div>

      <div class="outro-sub" id="o-sub">2026 NASA Space Apps Challenge</div>
      <div class="outro-headline" id="o-head">THEY NEVER CAME HOME TO CLAIM THEIR WARRANTIES.</div>
      <div class="outro-promise" id="o-promise" data-layout-allow-occlusion>
        Today, they stand as eternal monuments across the solar system.
      </div>
      <div class="cta-badge" id="o-cta">
        <span>Explore The Planetary Atlas</span>
        <span>→</span>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#hud-bar-4", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.1);
      tl.fromTo("#o-sub", { opacity: 0, y: -15 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.2);
      tl.fromTo("#o-head", { opacity: 0, scale: 0.9, y: 25 }, { opacity: 1, scale: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.6);
      tl.fromTo("#o-promise", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.3);

      // Strong cue lock with bell impact at 2.41s (17.91s on master timeline)
      tl.fromTo("#o-cta", { opacity: 0, scale: 0.82, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "back.out(1.7)" }, 2.41);

      // Final gentle fadeout ending at 4.5s
      tl.to("#root", { opacity: 0, duration: 0.6, ease: "power1.in" }, 3.9);

      window.__timelines = window.__timelines || {};
      window.__timelines["scene4"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
